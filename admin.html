<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NovaChat Admin</title><link rel="stylesheet" href="style.css"></head><body><header class="navbar"><div class="logo"><span class="logo-dot"></span>NovaChat Admin</div><button id="logout" class="secondary-btn">Logout</button></header><main class="container admin"><section id="login" class="card welcome"><div class="hero-icon">✦</div><h1>Admin Dashboard</h1><p>Secure moderation console.</p><input id="password" type="password" placeholder="Admin password"><button id="loginBtn" class="primary-btn">Sign in</button><p id="error" class="error"></p></section><section id="dash" class="hidden"><div class="stats"><div class="card stat"><b id="users">0</b><span>Users</span></div><div class="card stat"><b id="reports">0</b><span>Open Reports</span></div><div class="card stat"><b id="blocked">0</b><span>Blocked Users</span></div></div><section class="card"><h2>Reports</h2><div id="reportList"></div></section><section class="card"><h2>Users</h2><div id="userList"></div></section></section></main><script src="admin.js"></script></body></html>
